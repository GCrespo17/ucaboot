# Continuous integration: runs on every PR to main and on every push to main.
# A PR can only be merged when all jobs pass (required checks in branch protection).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token: CI only reads the code, it never writes to the repo
permissions:
  contents: read

# A new push to the same PR cancels the run still in progress
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # same as the Dockerfile image
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # --passWithNoTests: there are no tests yet; drop it once the domain has them
      - run: npm test -- --passWithNoTests
      - run: npm run build

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # build = tsc -b (typecheck) + vite build
      - run: npm run build

  docker:
    name: Docker images (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Same image Render will run (target runtime). Not pushed anywhere yet.
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: runtime
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build nginx image (frontend build + routing)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: nginx/Dockerfile
          push: false
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx
